<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#8B1A1A" />
    <meta name="description" content="PROJO GROUP — Rustenburg's Own. Ride. Shop. Deliver & Services." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PROJO GROUP" />

    <!-- Open Graph -->
    <meta property="og:title" content="PROJO GROUP — Rustenburg's Own" />
    <meta property="og:description" content="Ride. Shop. Deliver & Services. Serving Rustenburg and North West Province." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/assets/logo/PROJO_LOGO.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Apple touch icon -->
    <link rel="apple-touch-icon" href="/assets/logo/PROJO_LOGO.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />

    <title>PROJO GROUP — Rustenburg's Own</title>

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      /* Allow auto-rotate */
      @media screen and (orientation: landscape) {
        body { min-height: 100vw; }
      }
      body {
        background: #0d0505;
        color: #f5ede8;
        font-family: 'DM Sans', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overscroll-behavior: none;
      }
      .leaflet-pane { z-index: 1 !important; }
      .leaflet-top, .leaflet-bottom { z-index: 2 !important; }

      /* Splash screen */
      #splash {
        position: fixed; inset: 0;
        background: radial-gradient(ellipse at top, rgba(139,26,26,0.3) 0%, #0d0505 60%);
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 16px; z-index: 9999;
        transition: opacity 0.5s;
      }
      #splash.hidden { opacity: 0; pointer-events: none; }
      #splash .coin {
        width: 90px; height: 90px; border-radius: 50%;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(232,184,75,0.5);
        animation: popIn 0.8s cubic-bezier(0.175,0.885,0.32,1.275);
      }
      #splash .coin img { width: 100%; height: 100%; object-fit: cover; }
      #splash .coin-fallback {
        width: 90px; height: 90px; border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #f5d078, #e8b84b, #c49a2f, #9a7520);
        display: flex; align-items: center; justify-content: center;
        font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 800;
        color: #2a1a00; box-shadow: 0 0 40px rgba(232,184,75,0.5);
        animation: popIn 0.8s cubic-bezier(0.175,0.885,0.32,1.275);
      }
      #splash .name {
        font-family: 'Syne', sans-serif; font-size: 1.6rem;
        font-weight: 800; color: #e8b84b; letter-spacing: 3px;
        animation: fadeUp 0.6s ease 0.3s both;
      }
      #splash .tag {
        font-size: 12px; color: #7a5a55; letter-spacing: 0.5px;
        animation: fadeUp 0.6s ease 0.5s both;
      }
      #splash .loading-bar {
        width: 120px; height: 2px; background: rgba(232,184,75,0.15);
        border-radius: 2px; overflow: hidden; margin-top: 8px;
        animation: fadeUp 0.6s ease 0.5s both;
      }
      #splash .loading-bar-fill {
        height: 100%; background: #e8b84b; border-radius: 2px;
        animation: loadBar 1.5s ease forwards;
      }
      @keyframes popIn {
        0% { transform: scale(0.3) rotate(-180deg); opacity: 0; }
        100% { transform: scale(1) rotate(0deg); opacity: 1; }
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes loadBar {
        from { width: 0%; }
        to { width: 100%; }
      }

      /* PWA install banner */
      #install-banner {
        display: none;
        position: fixed; bottom: 0; left: 0; right: 0; z-index: 9998;
        background: #120808; border-top: 1px solid rgba(232,184,75,0.25);
        padding: 16px 20px; align-items: center; gap: 12px;
        font-family: 'DM Sans', sans-serif;
        box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
      }
      #install-banner.show { display: flex; }
      #install-banner img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
      #install-banner .text { flex: 1; }
      #install-banner .text strong { display: block; font-size: 14px; font-weight: 700; color: #f5ede8; }
      #install-banner .text span { font-size: 12px; color: #7a5a55; }
      #install-banner button.install {
        background: #e8b84b; color: #1a0808; border: none;
        border-radius: 8px; padding: 10px 18px; font-size: 13px;
        font-weight: 800; cursor: pointer; font-family: 'DM Sans', sans-serif;
        white-space: nowrap;
      }
      #install-banner button.dismiss {
        background: transparent; color: #7a5a55; border: none;
        font-size: 18px; cursor: pointer; padding: 4px;
      }
    </style>
  </head>
  <body>

    <!-- Splash screen -->
    <div id="splash">
      <div class="coin">
        <img src="/assets/logo/PROJO_LOGO.png" alt="PROJO GROUP"
          onerror="this.parentElement.style.display='none';document.getElementById('coin-fallback').style.display='flex'" />
      </div>
      <div class="coin-fallback" id="coin-fallback" style="display:none">PROJO</div>
      <div class="name">PROJO GROUP</div>
      <div class="tag">Rustenburg's Own. Ride. Shop. Deliver &amp; Services.</div>
      <div class="loading-bar"><div class="loading-bar-fill"></div></div>
    </div>

    <!-- PWA Install Banner -->
    <div id="install-banner">
      <img src="/assets/logo/PROJO_LOGO.png" alt="PROJO GROUP"
        onerror="this.style.display='none'" />
      <div class="text">
        <strong>Install PROJO GROUP</strong>
        <span>Add to your home screen for quick access</span>
      </div>
      <button class="install" onclick="installApp()">Install App</button>
      <button class="dismiss" onclick="dismissBanner()">✕</button>
    </div>

    <div id="root"></div>

    <script>
      // Hide splash
      window.addEventListener('load', function() {
        setTimeout(function() {
          var splash = document.getElementById('splash');
          if (splash) {
            splash.classList.add('hidden');
            setTimeout(function() { splash.remove(); }, 500);
          }
        }, 1800);
      });

      // Register service worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(function(reg) { console.log('PROJO SW registered'); })
            .catch(function(err) { console.log('SW error:', err); });
        });
      }

      // PWA install prompt
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        deferredPrompt = e;
        // Show banner after 3 seconds
        setTimeout(function() {
          var banner = document.getElementById('install-banner');
          if (banner) banner.classList.add('show');
        }, 3000);
      });

      function installApp() {
        var banner = document.getElementById('install-banner');
        if (banner) banner.classList.remove('show');
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(function(result) {
            console.log('Install result:', result.outcome);
            deferredPrompt = null;
          });
        }
      }

      function dismissBanner() {
        var banner = document.getElementById('install-banner');
        if (banner) banner.classList.remove('show');
      }

      // Hide banner if already installed
      window.addEventListener('appinstalled', function() {
        var banner = document.getElementById('install-banner');
        if (banner) banner.classList.remove('show');
        console.log('PROJO GROUP installed as PWA!');
      });
    </script>
  </body>
</html>
